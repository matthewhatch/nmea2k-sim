[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nmea-engine-sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["python-can==4.6.1"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
dashboard = ["PySide6==6.8.3"]

[project.scripts]
nmea-dashboard = "nmea_sim.dashboard:main"
nmea-simulator = "nmea_sim.simulator:main"
nmea-consumer = "nmea_sim.consumer:main"
nmea-receiver = "nmea_sim.receiver:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["vcan: requires Linux vcan0 and SocketCAN access"]

[tool.setuptools.package-data]
nmea_sim = ["qml/*.qml"]
